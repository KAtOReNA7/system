name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      M1_APP_ENV: ci
      M1_DATABASE_URL: ""
      M1_DATABASE_READONLY_URL: ""
      M1_DATABASE_BACKGROUND_URL: ""
      DATABASE_URL: ""
      PGHOST: ""
      PGPORT: ""
      PGDATABASE: ""
      PGUSER: ""
      PGPASSWORD: ""
      OPENAI_API_KEY: ""
      OPENAI_BASE_URL: ""
      TAVILY_API_KEY: ""
      M2_V2_EVIDENCE_API_BASE_URL: ""
      M2_V2_EVIDENCE_APPROVED_HOST: ""
      M2_V2_APPROVED_RELAY_HOST: ""
      M2_V2_EVIDENCE_PROVIDER: ""
      M2_V2_SEARCH_PROVIDER: ""
      M2_V2_TAVILY_BASE_URL: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Calibration contracts verify files against frozen historical commits.
          fetch-depth: 0
          # PR remediation must be evaluated at the contributor's exact HEAD,
          # not at a synthetic GitHub merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify exact event head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node -e "const {execFileSync}=require('node:child_process');const actual=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();if(actual!==process.env.EXPECTED_HEAD_SHA)throw new Error('checkout_is_not_exact_event_head')"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: npm ci

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-ci.txt

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Check for real data and secrets
        run: npm run check:no-real-data

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Toolchain and test registry contract
        run: npm run test:toolchain-contract

      # The merged PR #7 exact-branch preflight remains available as a
      # historical command, but it is not a valid gate for unrelated branches.
      - name: Public default test registry
        run: npm test

      # Default smoke mode is fixture-only and does not connect to PostgreSQL.
      - name: Smoke
        run: npm run smoke

      # Admin E2E starts an in-process local HTTP server with no database URLs.
      - name: Admin E2E
        run: npm run test:e2e

  verify-windows:
    runs-on: windows-latest
    env:
      M1_APP_ENV: ci
      M1_DATABASE_URL: ""
      M1_DATABASE_READONLY_URL: ""
      M1_DATABASE_BACKGROUND_URL: ""
      DATABASE_URL: ""
      PGHOST: ""
      PGPORT: ""
      PGDATABASE: ""
      PGUSER: ""
      PGPASSWORD: ""
      OPENAI_API_KEY: ""
      OPENAI_BASE_URL: ""
      TAVILY_API_KEY: ""
      M2_V2_EVIDENCE_API_BASE_URL: ""
      M2_V2_EVIDENCE_APPROVED_HOST: ""
      M2_V2_APPROVED_RELAY_HOST: ""
      M2_V2_EVIDENCE_PROVIDER: ""
      M2_V2_SEARCH_PROVIDER: ""
      M2_V2_TAVILY_BASE_URL: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify exact event head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node -e "const {execFileSync}=require('node:child_process');const actual=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();if(actual!==process.env.EXPECTED_HEAD_SHA)throw new Error('checkout_is_not_exact_event_head')"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: npm ci

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-ci.txt

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Check for real data and secrets
        run: npm run check:no-real-data

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Toolchain and test registry contract
        run: npm run test:toolchain-contract

      - name: Public default test registry
        run: npm test

      - name: Smoke
        run: npm run smoke

      - name: Admin E2E
        run: npm run test:e2e

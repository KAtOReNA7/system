      - name: Verify exact event head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node -e "const {execFileSync}=require('node:child_process');const actual=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();if(actual!==process.env.EXPECTED_HEAD_SHA)throw new Error('checkout_is_not_exact_event_head')"

      - name: Attach exact M2 pull request head to local branch
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'codex/m2-') }}
        run: git switch -c codex/m2-ci-exact-head

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: npm ci

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check --no-input numpy==2.5.1 pandas==3.0.3 openpyxl==3.1.5

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Check for real data and secrets

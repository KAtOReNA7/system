      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: S1 focused contract validation
        run: npm run test:m2-v2:s1-focused

      - name: B1 authority graph and readonly proof validation
        run: npm run test:m2-v2:b1-authority

      - name: S1 preflight and first isolated default test chain
        if: ${{ github.event_name == 'pull_request' }}
        env:

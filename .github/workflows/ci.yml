name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      M1_APP_ENV: ci
      M1_DATABASE_URL: ""
      M1_DATABASE_READONLY_URL: ""
      M1_DATABASE_BACKGROUND_URL: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Check for real data and secrets
        run: npm run check:no-real-data

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Default smoke mode is fixture-only and does not connect to PostgreSQL.
      - name: Smoke
        run: npm run smoke

      # Admin E2E starts an in-process local HTTP server with no database URLs.
      - name: Admin E2E
        run: npm run test:e2e

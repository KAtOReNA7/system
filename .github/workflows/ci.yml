      - name: Live runtime request-ledger integration
        run: npm run test:m2-v2:live-runtime-ledger

      - name: Offline remediation transaction adapter
        run: npm run test:m2-v2:offline-remediation

      - name: Synthetic private recovery fault injection
        run: npm run test:m2-v2:private-recovery

      - name: Synthetic migration integrity
        run: npm run test:m2-v2:migration-integrity

      - name: B3 safe-cache and provider-boundary validation
        run: npm run test:m2-v2:b3-safe-cache-provider

      - name: B4 event tuple and conflict applicability validation
        run: npm run test:m2-v2:b4-event-tuple

      - name: B5 workbook and required-artifact policy validation
        run: npm run test:m2-v2:b5-workbook-artifact

      - name: B6 provider-free authority and atomic promotion validation
        run: npm run test:m2-v2:b6-offline-authority

      - name: Independent workbook verification
